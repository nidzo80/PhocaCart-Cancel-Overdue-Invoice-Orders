PLG_TASK_PCPINVOICECANCEL="Task - Phoca Cart: Otkazivanje prekoračenih Invoice porudžbina"

PLG_TASK_PCPINVOICECANCEL_TASK_TITLE="Phoca Cart: Otkaži prekoračene invoice porudžbine"
PLG_TASK_PCPINVOICECANCEL_TASK_DESC="Pronalazi Phoca Cart porudžbine kojima je istekao rok za plaćanje (invoice_due_date) a nisu plaćene, i menja im status u Cancelled."

PLG_TASK_PCPINVOICECANCEL_FIELD_STATE_PENDING_LABEL="ID status(a) porudžbine koja čeka plaćanje"
PLG_TASK_PCPINVOICECANCEL_FIELD_STATE_PENDING_DESC="status_id vrednost(i) odvojene zarezom iz Components -> Phoca Cart -> Order Statuses koje označavaju 'čeka se plaćanje' (default instalacija: 1 = Pending). Proveravaju se samo porudžbine u ovim statusima."

PLG_TASK_PCPINVOICECANCEL_FIELD_STATE_CANCELLED_LABEL="ID statusa za otkazano"
PLG_TASK_PCPINVOICECANCEL_FIELD_STATE_CANCELLED_DESC="status_id koji se postavlja na prekoračene porudžbine (default instalacija: 3 = Canceled). Proveri tačan ID u Components -> Phoca Cart -> Order Statuses na ovom sajtu."

PLG_TASK_PCPINVOICECANCEL_FIELD_PAYMENT_IDS_LABEL="ID(evi) načina plaćanja (opciono)"
PLG_TASK_PCPINVOICECANCEL_FIELD_PAYMENT_IDS_DESC="payment_id vrednosti odvojene zarezom (Components -> Phoca Cart -> Payment Methods), da bi se task ograničio samo na invoice/offline metode plaćanja. Ostaviti prazno za sve metode."

PLG_TASK_PCPINVOICECANCEL_FIELD_COMMENT_LABEL="Komentar pri otkazivanju"
PLG_TASK_PCPINVOICECANCEL_FIELD_COMMENT_DESC="Tekst koji se čuva/loguje kada se porudžbina automatski otkaže."

PLG_TASK_PCPINVOICECANCEL_FIELD_BATCH_LIMIT_LABEL="Limit po izvršenju"
PLG_TASK_PCPINVOICECANCEL_FIELD_BATCH_LIMIT_DESC="Maksimalan broj porudžbina koje se obrađuju po jednom pokretanju task-a."

PLG_TASK_PCPINVOICECANCEL_FIELD_DRYRUN_LABEL="Dry run (samo log, bez izmene podataka)"
PLG_TASK_PCPINVOICECANCEL_FIELD_DRYRUN_DESC="Ostaviti uključeno dok se testira. Kada je uključeno, pronađene porudžbine se samo loguju, ne otkazuju se."
