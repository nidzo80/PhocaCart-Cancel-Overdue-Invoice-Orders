PLG_TASK_PCPINVOICECANCEL="Task - Phoca Cart: Cancel Overdue Invoice Orders"

PLG_TASK_PCPINVOICECANCEL_TASK_TITLE="Phoca Cart: Cancel overdue invoice orders"
PLG_TASK_PCPINVOICECANCEL_TASK_DESC="Finds Phoca Cart orders whose invoice due date has passed while still unpaid, and moves them to Cancelled."

PLG_TASK_PCPINVOICECANCEL_FIELD_STATE_PENDING_LABEL="Pending order status ID(s)"
PLG_TASK_PCPINVOICECANCEL_FIELD_STATE_PENDING_DESC="Comma separated status_id value(s) from Components -> Phoca Cart -> Order Statuses that count as 'awaiting payment' (default install: 1 = Pending). Only orders in one of these statuses are checked."

PLG_TASK_PCPINVOICECANCEL_FIELD_STATE_CANCELLED_LABEL="Cancelled order status ID"
PLG_TASK_PCPINVOICECANCEL_FIELD_STATE_CANCELLED_DESC="The status_id to set on overdue orders (default install: 3 = Canceled). Check Components -> Phoca Cart -> Order Statuses for the ID on this site."

PLG_TASK_PCPINVOICECANCEL_FIELD_PAYMENT_IDS_LABEL="Payment method ID(s) (optional)"
PLG_TASK_PCPINVOICECANCEL_FIELD_PAYMENT_IDS_DESC="Comma separated payment_id values (Components -> Phoca Cart -> Payment Methods) to restrict this task to invoice/offline payment methods only. Leave empty to check all payment methods."

PLG_TASK_PCPINVOICECANCEL_FIELD_COMMENT_LABEL="Cancellation comment"
PLG_TASK_PCPINVOICECANCEL_FIELD_COMMENT_DESC="Text stored/logged when an order is auto-cancelled."

PLG_TASK_PCPINVOICECANCEL_FIELD_BATCH_LIMIT_LABEL="Batch limit"
PLG_TASK_PCPINVOICECANCEL_FIELD_BATCH_LIMIT_DESC="Maximum number of orders processed per task run."

PLG_TASK_PCPINVOICECANCEL_FIELD_DRYRUN_LABEL="Dry run (log only, do not change data)"
PLG_TASK_PCPINVOICECANCEL_FIELD_DRYRUN_DESC="Keep this enabled while testing. When on, matching orders are only logged, never cancelled."
